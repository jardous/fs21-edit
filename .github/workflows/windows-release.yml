name: Windows portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional new release tag (for example v0.3.0); blank builds artifacts only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/requirements-build.txt
      - name: Install pinned build tools and application
        run: python -m pip install -r packaging/windows/requirements-build.txt -e ".[gui,dev]"
      - name: Native Windows regression checks (no pedal)
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy src/fs21
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze GUI and CLI
        run: python -m PyInstaller --clean --noconfirm packaging/windows/fs21.spec
      - name: Package binaries, licenses and corresponding sources
        run: python packaging/windows/package_release.py
      - name: Test the extracted release outside the checkout
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "fs21-release-smoke"
          Expand-Archive dist/windows-release/FS21-Windows-x64.zip -DestinationPath $destination
          $application = Join-Path $destination "FS21"
          & "$application/fs21-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preview = & "$application/fs21-cli.exe" export 8 --dry-run --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = $preview | ConvertFrom-Json
          if (-not $data.dry_run -or $data.banks[0].bank -ne 8) { throw "Invalid CLI output" }
          $report = Join-Path $env:RUNNER_TEMP "fs21-gui-smoke.json"
          $gui = Start-Process "$application/FS21.exe" -ArgumentList "--smoke-test",$report `
            -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "Packaged GUI failed: $($gui.ExitCode)" }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.gui_started -or -not $result.libusb_backend_loaded) {
            throw "Packaged GUI/backend verification failed"
          }
          Get-Content $report
          Copy-Item $report artifacts/windows-gui-smoke.json
          Copy-Item ($report -replace '\.json$','.png') artifacts/windows-gui-smoke.png
      - name: Collect startup log
        if: always()
        run: |
          $log = Join-Path $env:LOCALAPPDATA "FS21/fs21.log"
          if (Test-Path $log) {
            New-Item -ItemType Directory -Force artifacts | Out-Null
            Copy-Item $log artifacts/windows-startup.log
          }
      - name: Preserve smoke-test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-test
          path: |
            artifacts/windows-gui-smoke.*
            artifacts/windows-startup.log
          if-no-files-found: ignore
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/windows-release/*
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Publish new Windows preview (never overwrite an existing release)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid release tag"; exit 1;
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "FS21 for Windows x64 (preview)" \
            --notes-file packaging/windows/RELEASE_NOTES.md
