[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fs21"
version = "0.3.0"
description = "Evidence-driven, read-only Linux exporter for the FLAMMA FS21"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyusb>=1.2.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13"]

[project.scripts]
fs21 = "fs21.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["usb.*"]
ignore_missing_imports = true
